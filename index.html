<!DOCTYPE html>
<!-- Created by Axo's Stuff 2026 -->
<!-- UI created by AxoTwo -->
<!-- Credits to @allvideo for the original inspiration -->
<!-- Usage of this software to create scams, malware, exploits is prohibited -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZ Publish Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-title { font-size: 15px; font-weight: 600; }
    .topbar-sub { font-size: 12px; color: #999; }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }



    .tabs {
      display: flex;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px 8px 0 0;
      border-bottom: none;
      overflow: hidden;
    }

    .tab {
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 500;
      color: #888;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
    }

    .tab.active { color: #1a1a1a; border-bottom-color: #e5172d; }
    .tab:hover:not(.active) { color: #444; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 0 0 8px 8px;
      padding: 24px;
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: #e5172d; background: #fff; }
    .field input::placeholder { color: #bbb; }
    .field .hint { font-size: 11px; color: #aaa; margin-top: 5px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .row .field { margin-bottom: 0; }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 20px 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #888;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ddd;
      flex-shrink: 0;
    }
    .dot.running { background: #22c55e; animation: blink 1s infinite; }
    .dot.done    { background: #22c55e; }
    .dot.error   { background: #f87171; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .progress-bar-wrap {
      height: 4px;
      background: #f0f0f0;
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #e5172d;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    .btn-row { display: flex; gap: 10px; }

    .btn {
      padding: 11px 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary { background: #e5172d; color: #fff; flex: 1; }
    .btn-primary:hover { background: #c0121f; }
    .btn-primary:disabled { background: #f5c0c5; cursor: not-allowed; }

    .btn-secondary { background: #f0f0f0; color: #555; }
    .btn-secondary:hover { background: #e5e5e5; }

    .log-box {
      background: #111;
      border-radius: 6px;
      height: 320px;
      overflow-y: auto;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.9;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .log-line { display: flex; gap: 10px; }
    .log-ts   { color: #444; flex-shrink: 0; }
    .log-ok   { color: #22c55e; }
    .log-err  { color: #f87171; }
    .log-info { color: #f59e0b; }

    .log-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .btn-link {
      background: none;
      border: none;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .btn-link:hover { color: #555; }

    footer {
      text-align: center;
      font-size: 11px;
      color: #bbb;
      margin-top: 32px;
      padding-bottom: 40px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">EZ Publish Service</span>
  <span class="topbar-sub">Roblox Universe and Place Tool</span>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('universe')">Create Universe</button>
    <button class="tab" onclick="switchTab('place')">Create Place</button>
    <button class="tab" onclick="switchTab('log')">Log</button>
  </div>

  <!-- Universe Panel -->
  <div id="panel-universe" class="panel active">
    <div class="card">
      <div class="field">
        <label>Roblox Security Cookie</label>
        <input type="password" id="u-cookie" placeholder="Paste your .ROBLOSECURITY cookie here"
               autocomplete="off" autocorrect="off" spellcheck="false" />
        <div class="hint">Wiped from this field the moment you click Start.</div>
      </div>
      <div class="field">
        <label>Template Place ID</label>
        <input type="text" id="u-template" value="95206881" />
        <div class="hint">Default is 95206881 (baseplate).</div>
      </div>
      <div class="row">
        <div class="field">
          <label>Number to Create</label>
          <input type="number" id="u-count" value="1" min="1" max="50" />
        </div>
        <div class="field">
          <label>Delay Between Requests (s)</label>
          <input type="number" id="u-delay" value="1" min="0.5" max="10" step="0.5" />
        </div>
      </div>
      <hr class="divider" />
      <div class="status-row">
        <div class="dot" id="u-dot"></div>
        <span id="u-status">Ready</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="u-bar"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="u-btn" onclick="runUniverses()">Start Creating</button>
        <button class="btn btn-secondary" onclick="stop()">Stop</button>
      </div>
    </div>
  </div>

  <!-- Place Panel -->
  <div id="panel-place" class="panel">
    <div class="card">
      <div class="field">
        <label>Roblox Security Cookie</label>
        <input type="password" id="p-cookie" placeholder="Paste your .ROBLOSECURITY cookie here"
               autocomplete="off" autocorrect="off" spellcheck="false" />
        <div class="hint">Wiped from this field the moment you click Start.</div>
      </div>
      <div class="field">
        <label>Universe ID</label>
        <input type="text" id="p-universe" placeholder="e.g. 123456789" />
      </div>
      <div class="field">
        <label>Template Place ID</label>
        <input type="text" id="p-template" value="95206881" />
        <div class="hint">Default is 95206881 (baseplate).</div>
      </div>
      <div class="row">
        <div class="field">
          <label>Number to Create</label>
          <input type="number" id="p-count" value="1" min="1" max="50" />
        </div>
        <div class="field">
          <label>Delay Between Requests (s)</label>
          <input type="number" id="p-delay" value="1" min="0.5" max="10" step="0.5" />
        </div>
      </div>
      <hr class="divider" />
      <div class="status-row">
        <div class="dot" id="p-dot"></div>
        <span id="p-status">Ready</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="p-bar"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="p-btn" onclick="runPlaces()">Start Creating</button>
        <button class="btn btn-secondary" onclick="stop()">Stop</button>
      </div>
    </div>
  </div>

  <!-- Log Panel -->
  <div id="panel-log" class="panel">
    <div class="card" style="border-radius:8px;">
      <div class="log-box" id="log"></div>
      <div class="log-actions">
        <button class="btn-link" onclick="clearLog()">Clear log</button>
      </div>
    </div>
  </div>

  <footer>EZ Publish Service | Made with love by Axo</footer>

</div>

<script>
  const WORKER_URL = 'https://ezpublishserv.acc943132.workers.dev/';
  let running = false;

  // All cookie field IDs in one place so nothing is missed
  const COOKIE_FIELDS = ['u-cookie', 'p-cookie'];

  function wipeCookieFields() {
    COOKIE_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  }

  // Wipe on tab/window close or navigate away
  window.addEventListener('beforeunload', wipeCookieFields);

  // Wipe when page is hidden (covers mobile app-switching, screen-off)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') wipeCookieFields();
  });

  function switchTab(id) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['universe', 'place', 'log'][i] === id);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
  }

  function log(msg, type = 'info') {
    const box = document.getElementById('log');
    const ts = new Date().toTimeString().slice(0, 8);
    const line = document.createElement('div');
    line.className = 'log-line';
    const tsSpan = document.createElement('span');
    tsSpan.className = 'log-ts';
    tsSpan.textContent = '[' + ts + ']';
    const msgSpan = document.createElement('span');
    msgSpan.className = 'log-' + type;
    msgSpan.textContent = msg;
    line.appendChild(tsSpan);
    line.appendChild(msgSpan);
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
  }

  function setStatus(prefix, text, state) {
    document.getElementById(prefix + '-status').textContent = text;
    document.getElementById(prefix + '-dot').className = 'dot' + (state ? ' ' + state : '');
  }

  function setProgress(prefix, val, total) {
    document.getElementById(prefix + '-bar').style.width =
      (total ? Math.round((val / total) * 100) : 0) + '%';
  }

  function stop() {
    running = false;
    log('Stop requested.', 'info');
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function callWorker(payload) {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (resp.status === 429) {
      const retryAfter = resp.headers.get('Retry-After') || '60';
      return { ok: false, message: 'Rate limited. Try again in ' + retryAfter + 's.' };
    }
    if (resp.status === 403) {
      return { ok: false, message: 'Request blocked by worker (origin not allowed).' };
    }

    return resp.json();
  }

  async function runUniverses() {
    const cookieEl = document.getElementById('u-cookie');
    const cookie   = cookieEl.value.trim();
    const template = parseInt(document.getElementById('u-template').value) || 95206881;
    const count    = parseInt(document.getElementById('u-count').value)    || 1;
    const delay    = parseFloat(document.getElementById('u-delay').value)  || 1;

    if (!cookie) { alert('Please paste your .ROBLOSECURITY cookie.'); return; }

    // Wipe from DOM immediately, before any async work
    cookieEl.value = '';

    running = true;
    switchTab('log');
    document.getElementById('u-btn').disabled = true;
    setProgress('u', 0, count);

    let ok = 0, err = 0;
    for (let i = 1; i <= count; i++) {
      if (!running) { log('Stopped by user.', 'info'); break; }
      setStatus('u', 'Creating universe ' + i + ' of ' + count + '...', 'running');
      try {
        const res = await callWorker({ action: 'createUniverse', cookie, templateId: template });
        log('[Universe ' + i + '/' + count + '] ' + res.message, res.ok ? 'ok' : 'err');
        res.ok ? ok++ : err++;
      } catch (e) {
        log('[Universe ' + i + '/' + count + '] Request failed.', 'err');
        err++;
      }
      setProgress('u', i, count);
      if (i < count && running) await sleep(delay * 1000);
    }

    setStatus('u', 'Done. ' + ok + ' succeeded, ' + err + ' failed.', ok > 0 ? 'done' : 'error');
    log('Finished: ' + ok + ' universes created, ' + err + ' failed.', 'info');
    document.getElementById('u-btn').disabled = false;
    running = false;
  }

  async function runPlaces() {
    const cookieEl   = document.getElementById('p-cookie');
    const cookie     = cookieEl.value.trim();
    const universeId = document.getElementById('p-universe').value.trim();
    const template   = parseInt(document.getElementById('p-template').value) || 95206881;
    const count      = parseInt(document.getElementById('p-count').value)    || 1;
    const delay      = parseFloat(document.getElementById('p-delay').value)  || 1;

    if (!cookie) { alert('Please paste your .ROBLOSECURITY cookie.'); return; }
    if (!universeId || isNaN(universeId)) { alert('Please enter a valid Universe ID.'); return; }

    // Wipe from DOM immediately, before any async work
    cookieEl.value = '';

    running = true;
    switchTab('log');
    document.getElementById('p-btn').disabled = true;
    setProgress('p', 0, count);

    let ok = 0, err = 0;
    for (let i = 1; i <= count; i++) {
      if (!running) { log('Stopped by user.', 'info'); break; }
      setStatus('p', 'Creating place ' + i + ' of ' + count + '...', 'running');
      try {
        const res = await callWorker({ action: 'createPlace', cookie, universeId, templateId: template });
        log('[Place ' + i + '/' + count + '] ' + res.message, res.ok ? 'ok' : 'err');
        res.ok ? ok++ : err++;
      } catch (e) {
        log('[Place ' + i + '/' + count + '] Request failed.', 'err');
        err++;
      }
      setProgress('p', i, count);
      if (i < count && running) await sleep(delay * 1000);
    }

    setStatus('p', 'Done. ' + ok + ' succeeded, ' + err + ' failed.', ok > 0 ? 'done' : 'error');
    log('Finished: ' + ok + ' places created, ' + err + ' failed.', 'info');
    document.getElementById('p-btn').disabled = false;
    running = false;
  }
</script>
</body>
</html>
